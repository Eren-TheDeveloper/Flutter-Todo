<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Görevlerim</title>
  <desc id="desc">Mor zemin üzerinde Görevlerim başlığı, görev kartları ve bir onay işareti.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#24134D"/>
      <stop offset="1" stop-color="#6936BD"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#DDD0FF"/>
      <stop offset="1" stop-color="#B99AFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1160" cy="35" r="240" fill="#FFFFFF" opacity=".035"/>
  <circle cx="990" cy="315" r="200" fill="#FFFFFF" opacity=".04"/>
  <circle cx="50" cy="350" r="150" fill="#FFFFFF" opacity=".025"/>
  <g font-family="Segoe UI, Arial, sans-serif">
