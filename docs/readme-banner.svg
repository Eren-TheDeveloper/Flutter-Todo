    <text x="155" y="74" text-anchor="middle" fill="#E6DCFF" font-size="12" font-weight="700" letter-spacing="2">PLANLA. TAMAMLA.</text>
    <text x="60" y="174" fill="#FFFFFF" font-size="76" font-weight="750" letter-spacing="-3">Görevlerim</text>
    <text x="64" y="223" fill="#E2D6FA" font-size="23">Günün daha sade, görevlerin daha düzenli.</text>
    <text x="65" y="290" fill="#C3ADEA" font-size="14" letter-spacing="2">FLUTTER  /  MATERIAL 3  /  TÜRKÇE</text>
  </g>
  <g transform="translate(766 56) rotate(-5 166 120)">
    <rect x="10" y="13" width="330" height="250" rx="24" fill="#160B30" opacity=".2"/>
    <rect width="330" height="250" rx="24" fill="#F7F5FC"/>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="26" y="42" fill="#38225F" font-size="19" font-weight="700">Bir adım daha ileri.</text>
      <rect x="24" y="64" width="282" height="48" rx="12" fill="#EAE3F7"/>
      <rect x="38" y="79" width="18" height="18" rx="5" fill="#7446BD"/>
      <path d="m42 88 4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="94" fill="#7A688E" font-size="15">Gününü planla</text>
      <path d="M70 89h102" stroke="#7A688E"/>
      <rect x="24" y="122" width="282" height="48" rx="12" fill="#EAE3F7"/>
      <rect x="38" y="137" width="18" height="18" rx="5" fill="none" stroke="#A28ABD" stroke-width="2"/>
      <text x="70" y="152" fill="#38225F" font-size="15">Önemli olana odaklan</text>
      <rect x="24" y="180" width="282" height="44" rx="12" fill="#673AB7"/>
      <text x="165" y="208" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="600">+ Yeni bir başlangıç</text>
    </g>
  </g>
  <circle cx="1100" cy="283" r="37" fill="url(#accent)"/>
  <path d="m1083 283 11 11 23-25" fill="none" stroke="#432071" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
